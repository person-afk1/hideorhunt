name: HideOrHunt
version: '1.0.0'
main: com.yourserver.hideorhunt.HideOrHuntPlugin
api-version: '1.21'
description: A hardcore beacon defense tournament plugin.
author: Arpan

commands:
  team:
    description: Manage Hide or Hunt teams
    usage: /team <create|join|list>
  hohadmin:
    description: Master admin controls for Hide or Hunt
    usage: /hohadmin <status|givebeacons|forceteam|destroybeacon|clearteams>
    aliases: [hha]
    permission: hideorhunt.admin
    permission-message: "<red>You must be an event operator to execute this command!</red>"

permissions:
  hideorhunt.admin:
    description: Full access to all tournament controls
    default: op
